<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Video frame / monitor shape -->
  <rect x="256" y="256" width="512" height="384" rx="48" fill="none" stroke="#ffffff" stroke-width="48" stroke-opacity="0.25"/>
  <!-- Play triangle -->
  <path d="M448 384 L640 480 L448 576 Z" fill="url(#play)"/>
  <!-- Down arrow (compression) -->
  <path d="M416 704 L512 800 L608 704 L608 608 L416 608 Z" fill="#ffffff"/>
  <rect x="480" y="768" width="64" height="128" rx="16" fill="#ffffff"/>
</svg>
