name: Release macOS Desktop
on:
  workflow_dispatch:
  push:
    branches: [codex/macos-workspace]
    paths:
      - .github/workflows/desktop-macos.yml
      - video-compressor/src-tauri/Cargo.toml
      - video-compressor/src-tauri/Cargo.lock
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: video-compressor
    steps:
      - name: Require updater signing key
        working-directory: .
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Add TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets before publishing signed updates.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video-compressor/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: video-compressor/src-tauri -> target
      - name: Restore shipped portable engines
        run: |
          test "$(uname -m)" = arm64
          mount="$RUNNER_TEMP/lightvid-old"
          mkdir -p "$mount" src-tauri/binaries
          hdiutil attach public/downloads/轻影_1.3.1_aarch64.dmg -mountpoint "$mount" -nobrowse -readonly
          trap 'hdiutil detach "$mount"' EXIT
          for engine in ffmpeg yt-dlp node; do
            source="$mount/轻影.app/Contents/MacOS/$engine"
            test -f "$source"
            cp "$source" "src-tauri/binaries/$engine-aarch64-apple-darwin"
            chmod +x "src-tauri/binaries/$engine-aarch64-apple-darwin"
          done
          src-tauri/binaries/ffmpeg-aarch64-apple-darwin -version
          src-tauri/binaries/node-aarch64-apple-darwin --version
          src-tauri/binaries/yt-dlp-aarch64-apple-darwin --lightvid-info
      - run: npm ci
      - name: Select macOS SDK for native AI enhancement
        run: |
          node --input-type=module <<'JS'
          import {readdirSync,appendFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const options=readdirSync('/Applications').filter(x=>/^Xcode.*\.app$/.test(x)).sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
          let found=false;
          for(const name of options){const path=`/Applications/${name}/Contents/Developer`;const sdk=spawnSync('xcrun',['--sdk','macosx','--show-sdk-version'],{encoding:'utf8',env:{...process.env,DEVELOPER_DIR:path}});if(sdk.status===0&&parseInt(sdk.stdout)>=26){appendFileSync(process.env.GITHUB_ENV,`DEVELOPER_DIR=${path}\n`);console.log(`Using ${name}, SDK ${sdk.stdout.trim()}`);found=true;break}}
          if(!found)throw Error('Xcode 26 SDK is required for native AI enhancement');
          JS
      - name: Prepare bundled offline AI
        run: node scripts/prepare-desktop-ai.mjs --force
      - run: npm run lint -- src
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build and sign installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run release:macos
      - name: Verify bundled engines, orientation, launch and media processing
        run: |
          app="$PWD/src-tauri/target/release/bundle/macos/轻影.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          LIGHTVID_UPDATE_ARCHIVE="$PWD/public/downloads/LightVid_1.9.0_aarch64.app.tar.gz" LIGHTVID_UPDATE_MANIFEST="$PWD/public/downloads/latest.json" cargo test --manifest-path src-tauri/Cargo.toml updater_tests::signed_update_rejects_tampering_and_replaces_only_app_bundle -- --exact
          for engine in ffmpeg yt-dlp node; do
            test -x "$app/Contents/MacOS/$engine"
            if otool -L "$app/Contents/MacOS/$engine" | grep -E '/opt/homebrew|/usr/local/'; then
              echo "Non-portable dependency in $engine"; exit 1
            fi
          done
          "$app/Contents/MacOS/ffmpeg" -y -f lavfi -i color=c=black:s=160x120:d=1 -c:v libx264 "$RUNNER_TEMP/input.mp4"
          "$app/Contents/MacOS/ffmpeg" -y -i "$RUNNER_TEMP/input.mp4" -c:v libx264 -crf 30 "$RUNNER_TEMP/output.mov"
          test -s "$RUNNER_TEMP/output.mov"
          test -s "$app/Contents/Resources/desktop-ai/models/lama_fp32.onnx"
          "$app/Contents/MacOS/node" -e 'const ort=require(process.argv[1]); console.log(ort.listSupportedBackends())' "$app/Contents/Resources/desktop-ai/node_modules/onnxruntime-node"
          LIGHTVID_APP="$app" node scripts/test-desktop-ai.mjs
          LIGHTVID_APP="$app" node scripts/test-desktop-enhancement.mjs
          LIGHTVID_APP="$app" node scripts/test-desktop-translation.mjs
          open "$app"
          sleep 8
          pgrep -x lightvid
          screencapture -x "$RUNNER_TEMP/desktop-launch.png"
          pkill -x lightvid
      - uses: actions/upload-artifact@v4
        with:
          name: LightVid-macOS-1.9.0
          path: |
            video-compressor/public/downloads/轻影_1.9.0_aarch64.dmg
            video-compressor/public/downloads/LightVid_*.app.tar.gz*
            video-compressor/public/downloads/latest.json
            ${{ runner.temp }}/desktop-launch.png
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.9.0 public/downloads/轻影_1.9.0_aarch64.dmg public/downloads/LightVid_1.9.0_aarch64.app.tar.gz public/downloads/LightVid_1.9.0_aarch64.app.tar.gz.sig public/downloads/latest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title '轻影 1.9.0 · 高清增强与精细修补' --notes '更新日期：2026-11-28。新增高清增强独立入口，也可叠加在修补或字幕配音后。网页与桌面支持自然降噪和细节增强；支持的 macOS 26 设备可使用 Apple 原生 AI 2×超分，运行前检测硬件与尺寸。新增固定浅色文字笔画修补，保留字缝背景，修正贴边水印残留；仍支持各选区独立起止时间。自然放大明确标为插值，AI 不支持时显示原因。适用于 Apple Silicon。'
